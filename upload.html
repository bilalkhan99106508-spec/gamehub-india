<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - GameHub India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 70px; }
        header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #00ffcc; }
        .container { padding: 20px; }
        .upload-card { background: #1e1e1e; border-radius: 10px; padding: 20px; border: 1px solid #333; }
        .upload-card h2 { font-size: 18px; margin-bottom: 15px; color: #ffcc00; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #aaa; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #00ffcc; color: #121212; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1f1f1f; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        nav a { text-decoration: none; color: #aaa; font-size: 11px; text-align: center; }
        nav a.active { color: #00ffcc; }
        nav div { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <header>🎮 GameHub India - Upload</header>

    <div class="container">
        <div class="upload-card">
            <h2>🔥 अपनी गेमिंग क्लिप अपलोड करें</h2>
            <div class="input-group">
                <label>वीडियो का शीर्षक (Title)</label>
                <input type="text" placeholder="जैसे: TeamOGxShaikh BGMI Clutch">
            </div>
            <div class="input-group">
                <label>YouTube वीडियो लिंक या ID</label>
                <input type="text" placeholder="यहाँ YouTube लिंक डालें">
            </div>
            <div class="input-group">
                <label>विवरण (Description)</label>
                <textarea rows="3" placeholder="अपने गेमप्ले के बारे में कुछ लिखें..."></textarea>
            </div>
            <button class="btn" onclick="alert('क्लिप सफलतापूर्व अपलोड हो गई है!')">Upload Now</button>
        </div>
    </div>

    <nav>
        <a href="index.html"><div>🏠</div>Home</a>
        <a href="#"><div>🎮</div>Games</a>
        <a href="#"><div>🏆</div>Tournaments</a>
        <a href="upload.html" class="active"><div>➕</div>Upload</a>
        <a href="#"><div>👤</div>Profile</a>
    </nav>

</body>
</html>
