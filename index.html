<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 70px; }
        header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #00ffcc; border-bottom: 1px solid #333; }
        .container { padding: 15px; }
        .clip-card { background: #1e1e1e; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 1px solid #333; }
        .clip-header { padding: 10px; font-size: 14px; font-weight: bold; color: #ffcc00; }
        .video-box { width: 100%; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; color: #777; font-size: 14px; }
        .clip-footer { padding: 10px; font-size: 12px; color: #aaa; }
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        nav a { text-decoration: none; color: #aaa; font-size: 11px; text-align: center; }
        nav a.active { color: #00ffcc; }
        nav a div { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <header>🎮 GameHub India</header>

    <div class="container">
        <div class="clip-card">
            <div class="clip-header">🔥 TeamOGxShaikh - BGMI 1v4 Clutch</div>
            <div class="video-box">Trending Gaming Clip Preview</div>
            <div class="clip-footer">❤️ 1.2K Likes &nbsp;&bull;&nbsp; 💬 340 Comments</div>
        </div>

        <div class="clip-card">
            <div class="clip-header">⚡ Free Fire Max - Insane Headshots</div>
            <div class="video-box">Gaming Clip Preview</div>
            <div class="clip-footer">❤️ 850 Likes &nbsp;&bull;&nbsp; 💬 120 Comments</div>
        </div>
    </div>

    <nav>
        <a href="#" class="active"><div>🏠</div>Home</a>
        <a href="#"><div>🎮</div>Games</a>
        <a href="#"><div>🏆</div>Tournaments</a>
        <a href="#"><div>➕</div>Upload</a>
        <a href="#"><div>👤</div>Profile</a>
    </nav>

</body>
</html>
